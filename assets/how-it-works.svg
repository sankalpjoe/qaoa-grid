<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">How the grid resilience experiment works</title>
  <desc id="desc">Four connected stages: trip one line, score switching options with a classical optimizer, sample plans with quantum circuits, and check every plan against grid constraints.</desc>
  <rect width="1200" height="250" rx="18" fill="#f4f8fb"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g fill="#ffffff" stroke="#dbe6ed" stroke-width="2">
      <rect x="29" y="38" width="264" height="174" rx="15"/>
      <rect x="322" y="38" width="264" height="174" rx="15"/>
      <rect x="615" y="38" width="264" height="174" rx="15"/>
      <rect x="908" y="38" width="264" height="174" rx="15"/>
    </g>
    <g fill="none" stroke="#91aabc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M296 125h20m-7-7 7 7-7 7M589 125h20m-7-7 7 7-7 7M882 125h20m-7-7 7 7-7 7"/></g>
    <g font-size="13" font-weight="700" letter-spacing="1.6">
      <text x="52" y="70" fill="#dc6e5a">01  OUTAGE</text>
      <text x="345" y="70" fill="#287f91">02  STARTING HINT</text>
      <text x="638" y="70" fill="#7258ad">03  QUANTUM SEARCH</text>
      <text x="931" y="70" fill="#207967">04  GRID CHECK</text>
    </g>
    <g fill="#172e40" font-size="23" font-weight="700">
      <text x="52" y="111">A line trips</text>
      <text x="345" y="111">Score 8 lines</text>
      <text x="638" y="111">Sample plans</text>
      <text x="931" y="111">Keep valid ones</text>
    </g>
    <g fill="#546b7b" font-size="16">
      <text x="52" y="145">Power shifts to other routes.</text>
      <text x="52" y="169">Some may overload.</text>
      <text x="345" y="145">Classical optimization gives</text>
      <text x="345" y="169">the warm start a hint.</text>
      <text x="638" y="145">Compare warm-started and</text>
      <text x="638" y="169">standard QAOA circuits.</text>
      <text x="931" y="145">Connected grid, with no</text>
      <text x="931" y="169">lines over their ratings.</text>
    </g>
    <g fill="#ffffff"><circle cx="269" cy="64" r="11" fill="#dc6e5a"/><circle cx="562" cy="64" r="11" fill="#287f91"/><circle cx="855" cy="64" r="11" fill="#7258ad"/><circle cx="1148" cy="64" r="11" fill="#207967"/></g>
  </g>
</svg>
